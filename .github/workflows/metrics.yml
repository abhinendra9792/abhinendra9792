name: Metrics
on:
  # Runs every 6 hours + on manual trigger + on push to main
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # =========================================================
      # 1) MAIN METRICS CARD — header, repos, releases, activity
      # =========================================================
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abhinendra9792
          filename: metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata

          # Coding habits & recent activity (commit-per-hour, per-day charts)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Languages — "Most used languages"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage

          # Isometric contribution calendar (the 3D green calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # =========================================================
      # 2) PAGESPEED — Performance / Accessibility / SEO scores
      #    (only works if you have a live website — edit the URL)
      # =========================================================
      - name: PageSpeed metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: metrics.pagespeed.svg
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://yourwebsite.com   # <-- change to your site
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes

      # =========================================================
      # 3) MUSIC — "Suggested tracks" (needs Apple Music / Spotify)
      #    Optional — remove this block if you don't want it.
      # =========================================================
      # - name: Music metrics
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: NOT_NEEDED
      #     filename: metrics.music.svg
      #     base: ""
      #     plugin_music: yes
      #     plugin_music_provider: apple
      #     plugin_music_playlist: YOUR_PUBLIC_APPLE_MUSIC_PLAYLIST_URL
      #     plugin_music_limit: 4
